name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Test container entrypoint
        if: runner.os == 'Linux'
        run: bun run test:entrypoint

      - name: Build
        run: bun run build

      - name: Smoke test Node CLI
        run: |
          node dist/main.js --help
          node dist/main.js debug --json

      - name: Check npm package
        if: runner.os == 'Linux'
        run: npm pack --dry-run